:root{--ink:#483528;--rust:#9d4c37;--paper:#f5eddf;--sand:#e6d4b8;--green:#4c604b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,#fff8e9,transparent 55%),var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh}main{max-width:760px;margin:auto;padding:24px 16px 44px;text-align:center}header .eyebrow{font:600 12px/1.4 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--rust)}h1{font-size:clamp(2rem,6vw,3.4rem);margin:8px 0 6px;font-weight:500}header p{margin:0 0 22px;color:#715c4b;font-size:1rem}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 16px;max-width:580px;font:600 14px system-ui,sans-serif}.stats{display:flex;gap:18px}button{font:inherit}#restart,.play-again{border:1px solid #b78c6c;background:#fff9ee;color:var(--ink);padding:10px 15px;border-radius:999px;cursor:pointer;font:600 13px system-ui,sans-serif}#restart:hover,.play-again:hover{background:#ecd7b8}.board{max-width:580px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,14px)}.card{position:relative;aspect-ratio:1/1;border:0;padding:0;background:transparent;cursor:pointer;perspective:900px;border-radius:11px;touch-action:manipulation}.card:focus-visible{outline:3px solid #325e86;outline-offset:3px}.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s ease}.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden;display:grid;place-items:center;border:2px solid #b99a73;box-shadow:0 3px 7px #4b321b20}.back{background:repeating-linear-gradient(35deg,#d9bc94,#d9bc94 5px,#dfc7a7 5px,#dfc7a7 10px);color:#85432e}.back::before{content:'';position:absolute;inset:7px;border:1px solid #a57a54;border-radius:6px}.back svg{width:66%;height:66%;position:relative;opacity:.88}.front{transform:rotateY(180deg);background:#fffdf8;padding:5px}.front img{width:100%;height:100%;object-fit:contain;border-radius:5px}.card.matched .front{border-color:#658164;background:#f4f8ed}.card.matched{cursor:default}.message{margin:18px auto 0;color:#715c4b;font-size:14px;line-height:1.5}.win{max-width:520px;margin:24px auto 0;background:#fff9ef;border:1px solid #d9b58a;padding:24px;border-radius:16px;box-shadow:0 8px 20px #3b241115}.win h2{font-weight:500;font-size:28px;margin:0 0 8px}.win p{margin:0 0 20px}.play-again{background:var(--rust);color:white;border-color:var(--rust)}[hidden]{display:none!important}footer{margin-top:28px;color:#846d58;font:12px system-ui,sans-serif}footer a{color:inherit;text-decoration:none;border-bottom:1px solid #cbb8a2}footer a:hover,footer a:focus-visible{color:var(--rust);border-bottom-color:currentColor}@media(max-width:420px){main{padding:20px 12px 32px}.board{gap:8px}.toolbar{font-size:12px}.stats{gap:10px}.front{padding:3px}.face{border-width:1px}}

const board=document.getElementById('board'),pairsEl=document.getElementById('pairs'),triesEl=document.getElementById('tries'),status=document.getElementById('status'),win=document.getElementById('win');
let count=8,deck=[],open=[],matched=0,tries=0,locked=false,timer=null;
const bison=`<svg viewBox="0 0 120 90" aria-hidden="true"><path fill="currentColor" d="M14 39Q10 23 33 23Q44 9 66 16Q82 17 91 30L101 31L110 24L108 38L117 45L110 53L98 53Q90 68 76 68L74 82L66 82L65 65L39 65L34 83L26 83L25 61Q12 58 14 39Z"/><circle cx="104" cy="43" r="2" fill="#e7cda7"/></svg>`;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){if(timer)clearTimeout(timer);timer=null;open=[];matched=0;tries=0;locked=false;const chosen=shuffle([...items]).slice(0,count);deck=shuffle(chosen.flatMap((item,id)=>[{id,item},{id,item}]));pairsEl.textContent=`Parejas: 0/${count}`;triesEl.textContent='Intentos: 0';document.getElementById('instructions').textContent=`Da la vuelta a las cartas y encuentra las ${count} parejas.`;status.textContent='Elige dos cartas para descubrir si son iguales.';win.hidden=true;board.hidden=false;board.classList.toggle('large',count===12);board.setAttribute('aria-label',`Juego de memoria con ${count*2} cartas`);board.innerHTML='';deck.forEach((entry,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='card';btn.setAttribute('aria-label',`Carta ${i+1}, boca abajo`);btn.setAttribute('aria-pressed','false');btn.innerHTML=`<span class="card-inner"><span class="face back">${bison}</span><span class="face front"><img src="${entry.item.src}" alt="${entry.item.name}" draggable="false"></span></span>`;btn.addEventListener('click',()=>flip(i));board.appendChild(btn)})}
function flip(i){if(locked||open.includes(i))return;const card=board.children[i];if(card.classList.contains('matched'))return;card.classList.add('flipped');card.setAttribute('aria-label',deck[i].item.name);card.setAttribute('aria-pressed','true');open.push(i);if(open.length!==2)return;tries++;triesEl.textContent=`Intentos: ${tries}`;const[a,b]=open;if(deck[a].id===deck[b].id){board.children[a].classList.add('matched');board.children[b].classList.add('matched');board.children[a].disabled=true;board.children[b].disabled=true;matched++;pairsEl.textContent=`Parejas: ${matched}/${count}`;open=[];status.textContent='¡Pareja encontrada!';if(matched===count){status.textContent='';win.hidden=false;document.getElementById('winText').textContent=`Has completado el juego en ${tries} intentos.`;document.getElementById('again').focus()}}else{locked=true;status.textContent='No son iguales. ¡Prueba otra vez!';timer=setTimeout(()=>{for(const index of [a,b]){const c=board.children[index];c.classList.remove('flipped');c.setAttribute('aria-label',`Carta ${index+1}, boca abajo`);c.setAttribute('aria-pressed','false')}open=[];locked=false;timer=null},1050)}}
document.querySelectorAll('.level').forEach(btn=>btn.addEventListener('click',()=>{count=Number(btn.dataset.count);document.querySelectorAll('.level').forEach(b=>b.classList.toggle('active',b===btn));reset()}));document.getElementById('restart').addEventListener('click',reset);document.getElementById('again').addEventListener('click',reset);reset();</script></body></html>
